<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星尘 · 宇宙粒子</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #0a0e1a;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            height: 100vh;
            width: 100vw;
            user-select: none;
        }

        /* ===== 画布容器 ===== */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            display: block;
        }

        /* ===== 中央内容层 ===== */
        .hero {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
            /* 让鼠标穿透，粒子可交互 */;
        }

        .hero h1 {
            font-size: clamp(3rem, 12vw, 8rem);
            font-weight: 800;
            letter-spacing: 0.08em;
            background: linear-gradient(135deg, #f0e6d0 0%, #b8a9c9 40%, #7ec8e3 70%, #f0e6d0 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 8s ease-in-out infinite alternate;
            text-shadow: 0 0 40px rgba(126, 200, 227, 0.15);
            filter: drop-shadow(0 4px 20px rgba(0, 0, 0, 0.3));
            line-height: 1.1;
            margin-bottom: 0.2em;
        }

        .hero p {
            font-size: clamp(1rem, 2.5vw, 1.6rem);
            font-weight: 300;
            letter-spacing: 0.4em;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            backdrop-filter: blur(2px);
            padding: 0.5em 1.5em;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 60px;
            background: rgba(10, 14, 26, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            pointer-events: auto;
            transition: all 0.4s ease;
        }

        .hero p:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(126, 200, 227, 0.3);
            color: rgba(255, 255, 255, 0.85);
            box-shadow: 0 8px 48px rgba(126, 200, 227, 0.08);
            transform: scale(1.02);
        }

        /* ===== 底部信息 ===== */
        .footer {
            position: fixed;
            bottom: 30px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 10;
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            font-weight: 300;
            pointer-events: none;
        }

        .footer span {
            display: inline-block;
            padding: 0 1em;
            background: rgba(10, 14, 26, 0.4);
            backdrop-filter: blur(4px);
            border-radius: 30px;
            padding: 0.5em 1.8em;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* ===== 动画 ===== */
        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* ===== 响应式微调 ===== */
        @media (max-width: 600px) {
            .hero p {
                letter-spacing: 0.2em;
                font-size: 0.9rem;
                padding: 0.4em 1.2em;
            }
            .footer {
                bottom: 16px;
                font-size: 0.6rem;
            }
            .footer span {
                padding: 0.3em 1.2em;
            }
        }

        /* 加载时的闪光过渡 */
        .fade-in {
            animation: fadeIn 2.2s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }
    </style>
</head>
<body>

    <!-- 粒子画布 -->
    <canvas id="particle-canvas"></canvas>

    <!-- 中央内容 -->
    <div class="hero fade-in">
        <h1>星尘</h1>
        <p>✦ 宇宙的呼吸 ✦</p>
    </div>

    <!-- 底部 -->
    <div class="footer">
        <span>✦ 移动鼠标 · 扰动星尘 ✦</span>
    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            //  1. 画布设置
            // ============================================================
            const canvas = document.getElementById('particle-canvas');
            const ctx = canvas.getContext('2d');

            let W, H;
            let particles = [];
            let mouse = { x: null, y: null, radius: 120 };
            let isMouseInside = false;

            // 配色方案 – 深空星尘
            const palette = [
                { r: 240, g: 230, b: 208 }, // 暖白
                { r: 184, g: 169, b: 201 }, // 淡紫
                { r: 126, g: 200, b: 227 }, // 冰蓝
                { r: 255, g: 215, b: 175 }, // 杏色
                { r: 210, g: 180, b: 222 }, // 浅紫罗兰
            ];

            // ============================================================
            //  2. 粒子类
            // ============================================================
            class Particle {
                constructor() {
                    this.reset(true);
                }

                reset(initial = false) {
                    // 位置 – 略微随机偏移，让分布更自然
                    this.x = Math.random() * W;
                    this.y = Math.random() * H;

                    // 半径：0.8 ~ 4.2，少数大颗粒
                    this.r = 0.8 + Math.random() * 3.4;
                    if (Math.random() < 0.08) this.r *= 1.8; // 偶尔的"恒星"

                    // 颜色：从调色板中选取并加一点随机变化
                    const col = palette[Math.floor(Math.random() * palette.length)];
                    this.color = {
                        r: Math.min(255, Math.max(0, col.r + (Math.random() - 0.5) * 30)),
                        g: Math.min(255, Math.max(0, col.g + (Math.random() - 0.5) * 30)),
                        b: Math.min(255, Math.max(0, col.b + (Math.random() - 0.5) * 30)),
                    };

                    // 透明度：0.3 ~ 0.95
                    this.baseAlpha = 0.3 + Math.random() * 0.65;

                    // 速度：极缓慢的漂移
                    this.vx = (Math.random() - 0.5) * 0.12;
                    this.vy = (Math.random() - 0.5) * 0.12;

                    // 用于呼吸动画的相位
                    this.phase = Math.random() * Math.PI * 2;
                    this.phaseSpeed = 0.008 + Math.random() * 0.012;

                    // 是否被鼠标"吸引"（用于平滑）
                    this.attracted = false;
                    this.attractX = 0;
                    this.attractY = 0;

                    // 初始位置记录（用于边界回弹）
                    this.homeX = this.x;
                    this.homeY = this.y;

                    // 随机延迟（用于波浪效果）
                    this.delay = Math.random() * 100;
                }

                update(time) {
                    // 呼吸波动（半径与透明度微变）
                    const breathe = Math.sin(time * this.phaseSpeed + this.phase) * 0.15 + 0.85;
                    const currentR = this.r * breathe;
                    const currentAlpha = this.baseAlpha * (0.7 + 0.3 * Math.sin(time * this.phaseSpeed * 0.7 + this.phase));

                    // ---- 鼠标交互 ----
                    if (isMouseInside && mouse.x !== null && mouse.y !== null) {
                        const dx = this.x - mouse.x;
                        const dy = this.y - mouse.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < mouse.radius) {
                            // 排斥力：将粒子推离鼠标
                            const force = (mouse.radius - dist) / mouse.radius;
                            const angle = Math.atan2(dy, dx);
                            const push = force * 1.8;
                            this.x += Math.cos(angle) * push;
                            this.y += Math.sin(angle) * push;

                            // 同时吸引到鼠标附近（形成星云聚集效果）
                            const attractForce = force * 0.25;
                            this.x += (mouse.x - this.x) * 0.01 * attractForce * 2;
                            this.y += (mouse.y - this.y) * 0.01 * attractForce * 2;

                            // 记录吸引状态
                            this.attracted = true;
                        } else {
                            this.attracted = false;
                        }
                    } else {
                        this.attracted = false;
                    }

                    // ---- 缓慢漂移 ----
                    this.x += this.vx;
                    this.y += this.vy;

                    // ---- 边界环绕（温柔地回到另一侧） ----
                    if (this.x < -20) this.x = W + 20;
                    if (this.x > W + 20) this.x = -20;
                    if (this.y < -20) this.y = H + 20;
                    if (this.y > H + 20) this.y = -20;

                    // 轻微向中心聚集（避免全部散开）
                    const centerX = W / 2;
                    const centerY = H / 2;
                    const toCenterX = centerX - this.x;
                    const toCenterY = centerY - this.y;
                    const distToCenter = Math.sqrt(toCenterX * toCenterX + toCenterY * toCenterY);
                    if (distToCenter > Math.max(W, H) * 0.6) {
                        this.x += toCenterX * 0.0006;
                        this.y += toCenterY * 0.0006;
                    }

                    // 返回绘制数据
                    return {
                        x: this.x,
                        y: this.y,
                        r: currentR,
                        alpha: currentAlpha,
                        color: this.color,
                        attracted: this.attracted,
                    };
                }
            }

            // ============================================================
            //  3. 初始化粒子
            // ============================================================
            function initParticles(count) {
                particles = [];
                for (let i = 0; i < count; i++) {
                    particles.push(new Particle());
                }
            }

            // ============================================================
            //  4. 绘制
            // ============================================================
            function draw(time) {
                // 清空 – 使用半透明黑色制造拖尾效果
                ctx.clearRect(0, 0, W, H);

                // 背景深空渐变
                const bgGrad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.8);
                bgGrad.addColorStop(0, '#141c2e');
                bgGrad.addColorStop(0.5, '#0a0e1a');
                bgGrad.addColorStop(1, '#05070e');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, W, H);

                // 绘制极淡的星云底纹（大范围光晕）
                const nebula = ctx.createRadialGradient(W * 0.3, H * 0.4, 0, W * 0.3, H * 0.4, W * 0.8);
                nebula.addColorStop(0, 'rgba(126, 200, 227, 0.02)');
                nebula.addColorStop(0.5, 'rgba(184, 169, 201, 0.02)');
                nebula.addColorStop(1, 'rgba(10, 14, 26, 0)');
                ctx.fillStyle = nebula;
                ctx.fillRect(0, 0, W, H);

                // ---- 更新并绘制所有粒子 ----
                const drawData = [];
                for (const p of particles) {
                    const data = p.update(time);
                    drawData.push(data);
                }

                // 先绘制连接线（更底层）
                drawConnections(drawData);

                // 再绘制粒子本身
                for (const d of drawData) {
                    const { r, g, b } = d.color;
                    const alpha = d.alpha;

                    // 发光效果：内圈亮，外圈柔和
                    const grad = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, d.r * 2.2);
                    grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${alpha * 0.9})`);
                    grad.addColorStop(0.4, `rgba(${r}, ${g}, ${b}, ${alpha * 0.5})`);
                    grad.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);

                    ctx.beginPath();
                    ctx.arc(d.x, d.y, d.r * 2.2, 0, Math.PI * 2);
                    ctx.fillStyle = grad;
                    ctx.fill();

                    // 核心亮点
                    ctx.beginPath();
                    ctx.arc(d.x, d.y, d.r * 0.6, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.5})`;
                    ctx.fill();

                    // 如果被鼠标吸引，加一个小光环
                    if (d.attracted) {
                        ctx.beginPath();
                        ctx.arc(d.x, d.y, d.r * 1.8, 0, Math.PI * 2);
                        ctx.strokeStyle = `rgba(255, 215, 175, ${alpha * 0.2})`;
                        ctx.lineWidth = 0.6;
                        ctx.stroke();
                    }
                }

                // ---- 鼠标交互指示器（微弱的环） ----
                if (isMouseInside && mouse.x !== null && mouse.y !== null) {
                    ctx.beginPath();
                    ctx.arc(mouse.x, mouse.y, mouse.radius, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
                    ctx.lineWidth = 1.2;
                    ctx.stroke();

                    // 内圈
                    ctx.beginPath();
                    ctx.arc(mouse.x, mouse.y, mouse.radius * 0.25, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
                    ctx.lineWidth = 0.8;
                    ctx.stroke();
                }
            }

            // ============================================================
            //  5. 粒子连接线 (增强星云感)
            // ============================================================
            function drawConnections(data) {
                // 只对距离较近的粒子画线，提升性能
                const maxDist = 80;
                const maxDistSq = maxDist * maxDist;
                const len = data.length;

                // 每隔一个粒子采样，避免 O(n²) 过大（保持流畅）
                const step = Math.max(1, Math.floor(len / 300));
                const sampled = [];
                for (let i = 0; i < len; i += step) {
                    sampled.push(data[i]);
                }

                // 画线透明度随距离变化
                for (let i = 0; i < sampled.length; i++) {
                    for (let j = i + 1; j < sampled.length; j++) {
                        const a = sampled[i];
                        const b = sampled[j];
                        const dx = a.x - b.x;
                        const dy = a.y - b.y;
                        const distSq = dx * dx + dy * dy;
                        if (distSq < maxDistSq && distSq > 5) {
                            const dist = Math.sqrt(distSq);
                            const alpha = (1 - dist / maxDist) * 0.08;
                            // 颜色混合
                            const r = (a.color.r + b.color.r) / 2;
                            const g = (a.color.g + b.color.g) / 2;
                            const bCol = (a.color.b + b.color.b) / 2;
                            ctx.beginPath();
                            ctx.moveTo(a.x, a.y);
                            ctx.lineTo(b.x, b.y);
                            ctx.strokeStyle = `rgba(${r|0}, ${g|0}, ${bCol|0}, ${alpha})`;
                            ctx.lineWidth = 0.6;
                            ctx.stroke();
                        }
                    }
                }
            }

            // ============================================================
            //  6. 鼠标 / 触摸事件
            // ============================================================
            function onMouseMove(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const clientX = e.clientX || e.touches?.[0]?.clientX || 0;
                const clientY = e.clientY || e.touches?.[0]?.clientY || 0;

                mouse.x = (clientX - rect.left) * scaleX;
                mouse.y = (clientY - rect.top) * scaleY;
                isMouseInside = true;
            }

            function onMouseLeave() {
                isMouseInside = false;
                mouse.x = null;
                mouse.y = null;
            }

            function onTouchStart(e) {
                e.preventDefault();
                onMouseMove(e);
            }

            function onTouchMove(e) {
                e.preventDefault();
                onMouseMove(e);
            }

            function onTouchEnd(e) {
                onMouseLeave();
            }

            // ============================================================
            //  7. 窗口自适应
            // ============================================================
            function resizeCanvas() {
                const dpr = window.devicePixelRatio || 1;
                const rect = canvas.getBoundingClientRect();
                W = window.innerWidth;
                H = window.innerHeight;

                canvas.width = W * dpr;
                canvas.height = H * dpr;
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';

                ctx.scale(dpr, dpr);

                // 粒子数量根据屏幕大小动态调整
                const targetCount = Math.min(800, Math.max(300, Math.floor((W * H) / 1800)));
                if (particles.length !== targetCount) {
                    initParticles(targetCount);
                } else {
                    // 如果数量不变，重新分布粒子
                    for (const p of particles) {
                        p.x = Math.random() * W;
                        p.y = Math.random() * H;
                        p.homeX = p.x;
                        p.homeY = p.y;
                    }
                }

                // 调整鼠标交互半径
                mouse.radius = Math.min(W, H) * 0.15;
            }

            // ============================================================
            //  8. 动画循环
            // ============================================================
            let animationFrameId = null;
            let startTime = performance.now();

            function animate(timestamp) {
                const elapsed = (timestamp - startTime) / 1000;
                draw(elapsed);
                animationFrameId = requestAnimationFrame(animate);
            }

            // ============================================================
            //  9. 启动
            // ============================================================
            function init() {
                // 设置事件监听
                window.addEventListener('resize', resizeCanvas);

                // 鼠标
                canvas.addEventListener('mousemove', onMouseMove);
                canvas.addEventListener('mouseleave', onMouseLeave);

                // 触摸
                canvas.addEventListener('touchstart', onTouchStart, { passive: false });
                canvas.addEventListener('touchmove', onTouchMove, { passive: false });
                canvas.addEventListener('touchend', onTouchEnd, { passive: false });

                // 初始化画布和粒子
                resizeCanvas();

                // 启动动画
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                startTime = performance.now();
                animate(startTime);
            }

            // 页面完全加载后启动
            if (document.readyState === 'complete') {
                init();
            } else {
                window.addEventListener('load', init);
            }

        })();
    </script>

</body>
</html>
